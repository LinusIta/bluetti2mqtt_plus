name: AC500 Secure BLE checks

on:
  push:
    branches: [main]
    paths:
      - "bluetti2mqtt_ac500_ble/**"
      - ".github/workflows/ac500-secure-ble.yml"
  pull_request:
    paths:
      - "bluetti2mqtt_ac500_ble/**"
      - ".github/workflows/ac500-secure-ble.yml"

jobs:
  secure-ble-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python syntax
        run: python -m compileall -q bluetti2mqtt_ac500_ble/rootfs/app bluetti2mqtt_ac500_ble/tests
      - name: Test command mailbox
        run: python -m unittest discover -s bluetti2mqtt_ac500_ble/tests -p 'test_*.py' -v
      - name: Verify add-on release version
        run: |
          grep -q '^version: "4.0.2"
 bluetti2mqtt_ac500_ble/config.yaml
