name: "Bluetti2MQTT Plus - AC500 Secure BLE"
version: "4.0.1"
slug: bluetti2mqtt_plus_v4_preview
description: "Standalone MQTT bridge for Bluetti AC500 with encrypted Bluetooth support"
url: https://github.com/LinusIta/bluetti2mqtt_plus
arch:
  - aarch64
  - amd64
build: {}
host_dbus: true
usb: true
init: false
services:
  - mqtt:need
options:
  bt_mac: "00:11:22:33:44:55"
  device_serial: "0000000000000"
  mqtt_host: ""
  mqtt_port: ""
  mqtt_username: ""
  mqtt_password: ""
  poll_sec: 15
  pack_poll_sec: 600
  pack_scan_sec: 3600
  ha_config: normal
  allow_writes: false
  debug: false
schema:
  bt_mac: str
  device_serial: str
  mqtt_host: str
  mqtt_port: str
  mqtt_username: str?
  mqtt_password: password?
  poll_sec: int
  pack_poll_sec: int
  pack_scan_sec: int
  ha_config: list(normal|none|advanced)
  allow_writes: bool
  debug: bool
